[package]
name = "rummage-md"
version = "0.1.0"
edition = "2021"
description = "Local hybrid (BM25 + semantic) Markdown/Word/PDF/OFD search TUI"
license = "MIT"

[[bin]]
name = "rummage"
path = "src/main.rs"

[lib]
name = "rummage"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.7", default-features = false }
bincode = "1.3"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fastembed = { version = "7.5", default-features = false, features = [
    "ort-download-binaries-native-tls",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jieba-rs = "0.11"
log = "0.4"
notify = "8.2"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std"] }
pdf-extract = "0.12"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
rapidocr-core = { version = "0.2.2", default-features = false }
ratatui = "0.29"
regex = "1"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
scour-search = { version = "0.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tokenizers = { version = "0.23", default-features = false }
toml = "0.9"
unicode-width = "0.2"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
scour-search = { path = "vendor/scour-search" }
pdf-extract = { path = "vendor/pdf-extract" }
rapidocr-core = { path = "vendor/rapidocr-core" }

[features]
# DirectML is enabled by default so a normal release build can use any DX12
# GPU for OCR; runtime provider auto-detection falls back to CPU when the
# driver/GPU is unavailable. Use --no-default-features for a CPU-only build.
default = ["directml"]
directml = ["rapidocr-core/directml"]

[profile.release]
lto = "thin"
