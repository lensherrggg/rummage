[package]
name = "scour-search"
version = "0.1.0"
edition = "2021"
description = "Embeddable hybrid search primitives (vendored, optional serde persistence)"
license = "MIT"
repository = "https://github.com/SA-Ark/scour"
readme = "README.md"

[lib]
name = "scour"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
